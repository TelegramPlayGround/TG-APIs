on:
  workflow_dispatch: {} # Allow manually kicking off builds
  schedule:
    - cron:  '0 */5 * * *'
name: Scrape Telegram API Schemas
jobs:
  build:
    name: Scrape
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 1
        ref: data

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: "3.10"

    - name: Set up NodeJS
      uses: actions/setup-node@v6
      with:
        node-version: 16

    - name: scrape preparations
      env:
        PYTG_HKHG_DOCS_JSON_URL: ${{ secrets.PYTG_HKHG_DOCS_JSON_URL }}
      run: |
          pip install --upgrade pip setuptools wheel
          wget https://github.com/TelegramPlayGround/TG-APIs/raw/7ea45a5/deploy.sh -O deploy.sh
          bash deploy.sh
